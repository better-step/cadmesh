name: Build and Push Docker Image

on:
  push:
    branches:
      - stable
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - stable
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_IMAGE: itsmechandu/steptohdf5

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            # Tag as 'latest' for pushes to main/master branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with version for tagged releases (e.g., v0.2.7 -> 0.2.7)
            type=semver,pattern={{version}}
            # Tag with major.minor for tagged releases (e.g., v0.2.7 -> 0.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with SHA for all commits
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
